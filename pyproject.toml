[project]
name = "pathology-fm-uncertainty"
version = "0.1.0"
description = "Out-of-distribution detection, calibration and selective prediction with frozen pathology foundation models"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # analysis
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.9",
    "joblib>=1.4",
    "matplotlib>=3.7",
    "pandas>=2.0",
    # embedding export
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0",
    "transformers>=4.44,<5",
    "huggingface-hub>=0.24",
    "conch @ git+https://github.com/Mahmoodlab/CONCH.git@141cc09c7d4ff33d8eda562bd75169b457f71a62",
    "tqdm>=4.65",
    "pillow>=10.0",
]

[project.optional-dependencies]
# dataset download and preparation
data = ["kaggle", "gdown", "h5py", "openpyxl", "tiffslide>=2.4"]

[tool.uv]
package = false
